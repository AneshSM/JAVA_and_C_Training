<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First</title>
    <style>
        form{
            background-image: image(src="");
            /* margin-top: 15rem; */
            margin-bottom: 15rem;
        }
        table{
            border: 1px solid black;

            width: 30rem;
            padding: 2rem 2rem;
        }
        table,td,th,tr{
            background-color: chartreuse;
        }
        label{
            margin-right:2rem;
        }
    </style>
</head>
<body>
    <form action="" target="">
            <table>
            <tr>
                <td><label for="fname" >First Name:</label></td>
                <td><input type="text" min="4" max="8" required></td>
            </tr>
            <tr>
                <td><label for="lname">Last Name:</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label for="">Gender:</label></td>
                <td>Male<input type="radio" name="" id="">Female<input type="radio"></td>
            </tr>
            <tr>
                <td>
                    <label for="number">Number:</label>
                </td>
                <td>
                    <input type="number" name="" id="" required>
                </td>
            </tr>
            <tr>
                <td>DOB:</td>
                <td><input type="date" name="" id="" required></td>
            </tr>
            <tr>
                <td>Time:</td>
                <td><input type="time" name="" id=""></td>
            </tr>
            <tr>
                <td>Range:</td>
                <td><input type="range" min="1"max="100" value="50"></td>
            </tr>
            <tr>
                <td>Search:<input type="search" name="" id=""></td>
            </tr>
            <tr>
                <td>Choose a color:</td>
                <td><input type="color" name="" id=""></td>
            </tr>
            <tr>
                <td><label for="email">Email:</label></td>
                <td><input type="email" required><br></td>
                
            </tr>
            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" required></td>
            </tr>
            <tr>
                <td><label for="">Import:</label></td>
                <td><input type="file" name="" id="" required></td>
            </tr>
            <tr>
                <td>Stay Signed in:</td>
                <td><input type="checkbox" name="" id="">Yes<input type="checkbox" name="" id="">No</td>
            </tr>
            <tr>
                <td><a href="tel:+91 9164204321">Call</a></td>
                <td><a href="mailto:aneshsm204@gmail.com">Sendmail</a></td>
            </tr>
            <tr>
                <td style="text-align: center;" colspan="2"><input type="reset" name="" id=""></td>
            </tr>
            <tr>
                <td style="text-align: center;" colspan="2"><input type="submit"></td>
            </tr>
        </table>
    </form>    
</body>
</html>
